[build-system]
requires = ["setuptools==83.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "tracecanary"
dynamic = ["version"]
description = "Deterministic privacy-regression checks for synthetic OTLP trace canaries."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{name = "EauDoon"}]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Security",
]

[project.urls]
Source = "https://github.com/EauDoon/operator-labs/tree/main/packages/tracecanary"
Issues = "https://github.com/EauDoon/operator-labs/issues"
Security = "https://github.com/EauDoon/operator-labs/blob/main/packages/tracecanary/SECURITY.md"
Documentation = "https://github.com/EauDoon/operator-labs/tree/main/packages/tracecanary#readme"

[project.scripts]
tracecanary = "tracecanary.cli:main"

[project.gui-scripts]
tracecanary-gui = "tracecanary.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

# __version__ in the package is the single source of truth; setuptools reads
# the literal statically, without importing the package.
[tool.setuptools.dynamic]
version = {attr = "tracecanary.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
