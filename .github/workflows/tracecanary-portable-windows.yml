name: TraceCanary portable Windows GUI

on:
  workflow_dispatch:
  push:
    tags: ["tracecanary-v0.*"]
  # A pull request that changes how the executable is built exercises the build.
  pull_request:
    paths:
      - ".github/workflows/tracecanary-portable-windows.yml"
      - "packages/tracecanary/TraceCanary.pyw"
      - "packages/tracecanary/pyproject.toml"
      - "tools/check_release.py"

permissions:
  contents: read

concurrency:
  group: tracecanary-portable-windows-${{ github.ref }}
  cancel-in-progress: false

defaults:
  run:
    working-directory: packages/tracecanary

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: "3.12"
      - name: Install pinned build tools
        run: python -m pip install --disable-pip-version-check "setuptools==83.0.0" "pyinstaller==6.15.0"
      - name: Install TraceCanary
        run: python -m pip install --no-deps .
      - name: Build portable GUI
        run: pyinstaller --noconfirm --clean --onefile --windowed --name TraceCanary --paths src TraceCanary.pyw
      - name: Smoke-test the built executable (headless)
        run: python -c "import subprocess; subprocess.run([r'dist/TraceCanary.exe', '--smoke-test'], check=True, timeout=60)"
      - name: Write artifact hash
        shell: pwsh
        run: |
          Compress-Archive -Path dist/TraceCanary.exe -DestinationPath dist/TraceCanary-windows-x64.zip
          (Get-FileHash dist/TraceCanary-windows-x64.zip -Algorithm SHA256).Hash.ToLowerInvariant() | Set-Content -NoNewline dist/TraceCanary-windows-x64.zip.sha256
      - name: Retain portable GUI assets
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: TraceCanary-windows-x64
          path: |
            packages/tracecanary/dist/TraceCanary-windows-x64.zip
            packages/tracecanary/dist/TraceCanary-windows-x64.zip.sha256
          if-no-files-found: error
          retention-days: 14
